<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boolean Cube</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>BOOLEAN CUBE</h1>
    <p>Identify the binary operation that transforms Input A and Input B into the result.</p>
  </div>
  <div class="score">SCORE <b id="score">0</b></div>
</header>

<main>
  <section class="region">
    <h2 class="blue">INPUT A</h2>
    <div class="stage"><div id="cubeA" class="cube blue-cube"></div></div>
  </section>

  <div class="operator"><strong>?</strong><span>OPERATION</span></div>

  <section class="region">
    <h2 class="yellow">INPUT B</h2>
    <div class="stage"><div id="cubeB" class="cube yellow-cube"></div></div>
  </section>

  <div class="equals">=</div>

  <section class="region">
    <h2 class="red">RESULT</h2>
    <div class="stage"><div id="cubeR" class="cube red-cube"></div></div>
  </section>
</main>

<section class="controls">
  <p>Select the correct operation:</p>
  <div id="message"></div>
  <div class="buttons">
    <button data-op="AND">AND</button>
    <button data-op="OR">OR</button>
    <button data-op="XOR">XOR</button>
    <button data-op="NOR">NOR</button>
    <button data-op="NAND">NAND</button>
    <button data-op="XNOR">XNOR</button>
  </div>
  <button id="next" class="next hidden">NEXT</button>
</section>
<script src="script.js"></script>
</body>
</html>
