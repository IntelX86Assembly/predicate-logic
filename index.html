<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boolean Cube — Actual 3D Spheres</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>BOOLEAN CUBE</h1>
    <p>Identify the binary operation that transforms Input A and Input B into the result.</p>
  </div>
  <div id="score" class="score">SCORE <strong>0</strong></div>
</header>

<main class="game">
  <section class="cube-region">
    <div class="cube-title blue-title">INPUT A</div>
    <div class="cube-stage" id="stageA"></div>
  </section>

  <section class="operator-region">
    <div class="operator-label">?</div>
    <div class="operator-subtitle">OPERATION</div>
  </section>

  <section class="cube-region">
    <div class="cube-title yellow-title">INPUT B</div>
    <div class="cube-stage" id="stageB"></div>
  </section>

  <section class="equals">=</section>

  <section class="cube-region">
    <div class="cube-title red-title">RESULT</div>
    <div class="cube-stage" id="stageR"></div>
  </section>
</main>

<section class="controls">
  <div class="prompt">Select the correct operation:</div>
  <div id="message" class="message"></div>
  <div class="operation-buttons">
    <button data-op="AND">AND</button>
    <button data-op="OR">OR</button>
    <button data-op="XOR">XOR</button>
    <button data-op="NOR">NOR</button>
    <button data-op="NAND">NAND</button>
    <button data-op="XNOR">XNOR</button>
  </div>
  <button id="nextButton" class="next-button hidden">NEXT</button>
</section>

<!-- Three.js is loaded from a public CDN. GitHub Pages can host this project
     as-is; no server or build step is required. -->
<script type="module" src="script.js"></script>
</body>
</html>
