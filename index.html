class Parser{
 constructor(s){this.s=s.replace(/\s+/g,"");this.i=0}

 imp(){let x=this.or();if(this.s[this.i]==="→"){this.i++;return{k:"imp",a:x,b:this.imp()}}return x}
 or(){let x=this.and();while(this.s[this.i]==="∨"){this.i++;x={k:"or",a:x,b:this.and()}}return x}
 and(){let x=this.unary();while(this.s[this.i]==="∧"){this.i++;x={k:"and",a:x,b:this.unary()}}return x}

  if(this.s[this.i]==="¬"){this.i++;return{k:"not",a:this.unary()}}
  if(this.s[this.i]==="∀"||this.s[this.i]==="∃"){
    let q=this.s[this.i++];
    // Bound variables are single identifiers (x, y, ...). Do not consume
    // the following predicate name when whitespace has been removed.
    let v=this.s[this.i++];
    if(!/[A-Za-z]/.test(v)) throw Error("invalid bound variable");
    return{k:q==="∀"?"all":"ex",v,a:this.unary()}
  }
  if(this.s[this.i]==="("){this.i++;let x=this.iff();this.eat(")");return x}
  let name=this.tok(),args=[];
  if(this.s[this.i]==="("){this.i++;if(this.s[this.i]!==")"){args.push(this.tok());while(this.s[this.i]===","){this.i++;args.push(this.tok())}}this.eat(")")}

function choose(btn,c){if(answered)return;answered=true;document.querySelectorAll(".answer").forEach(b=>b.disabled=true);let ok=equivalent(current.premise,c.formula);
 if(ok){btn.classList.add("correct");streak++;score+=(document.getElementById("difficulty").value==="easy"?10:document.getElementById("difficulty").value==="medium"?20:30);document.getElementById("feedback").className="feedback good";document.getElementById("feedback").textContent="Correct — the selected statement is logically equivalent."}
 else{btn.classList.add("wrong");streak=0;document.querySelectorAll(".answer").forEach(b=>{
  const formula=b.dataset.choiceFormula;
  if(formula&&equivalent(current.premise,formula))b.classList.add("correct");
});document.getElementById("feedback").className="feedback bad";document.getElementById("feedback").textContent="Incorrect — the highlighted choice is logically equivalent."}
 document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("next").classList.add("show")
}
function next(){qi=(qi+1)%20;render()}
document.getElementById("next").onclick=next;document.getElementById("difficulty").onchange=()=>{qi=0;render()};document.getElementById("mode").onchange=()=>{qi=0;render()};
document.addEventListener("keydown",e=>{if(["1","2","3","4"].includes(e.key)&&!answered)document.querySelectorAll(".answer")[+e.key-1]?.click();else if(e.key==="Enter"&&answered)next()});render();
</script></body></html>
