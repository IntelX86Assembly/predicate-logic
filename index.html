<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boolean Cube</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>BOOLEAN CUBE</h1>
    <p>Identify the binary operation that transforms Input A and Input B into the result.</p>
  </div>
  <div id="score" class="score">Score: 0</div>
</header>

<main class="game">
  <section class="cube-region">
    <div class="cube-title">INPUT A</div>
    <div class="cube-stage blue-stage"><div id="cubeA" class="cube"></div></div>
  </section>

  <section class="operator-region">
    <div class="operator-label">?</div>
    <div class="operator-subtitle">binary gate</div>
  </section>

  <section class="cube-region">
    <div class="cube-title">INPUT B</div>
    <div class="cube-stage yellow-stage"><div id="cubeB" class="cube"></div></div>
  </section>

  <section class="cube-region result-region">
    <div class="cube-title">RESULT</div>
    <div class="cube-stage red-stage"><div id="cubeResult" class="cube"></div></div>
  </section>
</main>

<section class="controls">
  <div id="message" class="message">Which binary operation produced the result?</div>
  <div class="operation-buttons">
    <button data-op="AND">AND</button>
    <button data-op="OR">OR</button>
    <button data-op="XOR">XOR</button>
    <button data-op="NOR">NOR</button>
    <button data-op="NAND">NAND</button>
    <button data-op="XNOR">XNOR</button>
  </div>
  <button id="nextButton" class="next-button hidden">NEXT</button>
</section>
<script src="script.js"></script>
</body>
</html>
